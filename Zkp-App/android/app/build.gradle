plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-parcelize'
    // 🦁 FIX: Version '1.9.20' wapas laga diya hai (ya jo aapka Kotlin version ho)
    id 'org.jetbrains.kotlin.plugin.serialization' version '1.9.20'
}

android {
    namespace 'com.example.zkpapp'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.zkpapp"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    // 🦁 CRITICAL FOR RUST: Rust ki .so files yahan se load hongi
    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        viewBinding true
        buildConfig true // Kabhi kabhi debug flags ke liye chahiye hota hai
    }

    // 🦁 CRITICAL FOR CRYPTO LIBS: Duplicate files error rokne ke liye
    packagingOptions {
        pickFirst 'META-INF/LICENSE'
        pickFirst 'META-INF/NOTICE'
        pickFirst 'META-INF/DEPENDENCIES'
        pickFirst 'META-INF/LICENSE.txt'
        pickFirst 'META-INF/NOTICE.txt'
        pickFirst 'META-INF/INDEX.LIST'
        pickFirst 'META-INF/io.netty.versions.properties'
    }
}

dependencies {
    // Android Core
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // ML Kit & Camera (Phase 6 - Passport Scan)
    implementation 'com.google.android.gms:play-services-mlkit-text-recognition:19.0.0'
    implementation "androidx.camera:camera-core:1.3.1"
    implementation "androidx.camera:camera-camera2:1.3.1"
    implementation "androidx.camera:camera-lifecycle:1.3.1"
    implementation "androidx.camera:camera-view:1.3.1"

    // JMRTD & NFC (Phase 6 - NFC Reading)
    implementation 'org.jmrtd:jmrtd:0.7.31'
    implementation 'net.sf.scuba:scuba-sc-android:0.0.20'
    implementation 'com.madgag.spongycastle:prov:1.58.0.0'

    // Networking (Phase 7 - Relay Server)
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.11.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.11.0'

    // QR Code (Phase 7 - Web Login Scanner)
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'com.google.zxing:core:3.4.1'

    // 🦁 PHASE 7 KEY DEPENDENCIES (Ye ZkAuth.kt ke liye zaroori hain)
    
    // 1. Serialization (JSON Parsing for Rust Output)
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.2'
    
    // 2. Coroutines (Async ZK Proof Generation)
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3'
    
    // 3. GSON (Legacy, used by Retrofit)
    implementation 'com.google.code.gson:gson:2.10.1'
}