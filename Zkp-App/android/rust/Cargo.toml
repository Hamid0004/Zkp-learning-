[package]
name = "zkp_mobile"
version = "0.1.0"
edition = "2021"

# 🦁 Force modern dependency resolution for Android
resolver = "2"

[lib]
crate-type = ["cdylib"]

[dependencies]
# 🌉 Android JNI Bridge
jni = { version = "0.21.1", default-features = false }

# 🧠 ZKP Engine (Plonky2)
# Used by: zk_auth.rs + proof_bench.rs (Test Proof Benchmark)
plonky2 = "0.2.2"
plonky2_field = "0.2.2"

# 📦 Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
bincode = "1.3"
base64 = "0.21"

# 🔐 Cryptography & Security
sha2 = "0.10"          # SHA256 hashing
rand = "0.8"           # Secure random number generation
hex = "0.4"            # Hex string encoding
zeroize = "1.7"        # ✅ Memory wiping (Secret cleanup)
once_cell = "1.18"     # ✅ Global variables (Lazy static) ke liye zaroori

# ==========================================
# 🛡️ DAY 87.5: KDF Cryptography (The Grinder)
# ==========================================
hkdf = "0.12.4"        # Super-fast HMAC-based Key Derivation (Daily Use)
argon2 = "0.5.3"       # Heavy memory-hard Key Derivation (Setup/Restore)

# 🛂 Passport Security (Optional but kept if needed)
rsa = { version = "0.9", features = ["sha2", "pem"] }

# 🦁 CRITICAL FIXES: Dependency Pinning for Android NDK
# In versions ko change mat karna, yeh NDK build errors rokte hain
crc32fast = "=1.3.2"   # Fast CRC32 (Pinned for NDK stability)
base64ct = "=1.6.0"
rayon = "=1.10.0"

# 📝 Logging
# Used by: lib.rs (init_logger) + proof_bench.rs (benchmark logs)
log = "0.4"
android_logger = "0.13"

[profile.release]
opt-level = 3           # Max speed for math
lto = "fat"             # Full Link Time Optimization
codegen-units = 1       # Better optimization
panic = "unwind"        # 🦁 IMPORTANT: Must be 'unwind' for catch_unwind to work
strip = true            # Strip symbols — smaller APK size (CRITICAL new change)
debug = false           # No debug info in release build (CRITICAL new change)
overflow-checks = true  # Safety for crypto math