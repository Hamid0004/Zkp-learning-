<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard | ZKP Identity</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=JetBrains+Mono:wght@300;500;700&display=swap" rel="stylesheet" />

  <style>
    /* ─── Tokens ─────────────────────────────────── */
    :root {
      --neon-blue:   #00d2ff;
      --neon-purple: #9d50bb;
      --neon-green:  #00ff88;
      --cyber-bg:    #050b18;
      --glass:       rgba(255,255,255,0.04);
      --border:      rgba(255,255,255,0.08);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
    }

    body {
      font-family: 'Syne', sans-serif;
      background: var(--cyber-bg);
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
    }

    /* ─── Galaxy Canvas ──────────────────────────── */
    #starfield {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    /* ─── Grid Floor ─────────────────────────────── */
    .grid-bg {
      position: fixed;
      inset: 0;
      z-index: 1;
      background-image:
        linear-gradient(rgba(0,210,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,210,255,0.025) 1px, transparent 1px);
      background-size: 60px 60px;
      transform: perspective(600px) rotateX(55deg) translateY(20%);
      transform-origin: center bottom;
      animation: gridScroll 25s linear infinite;
      mask-image: linear-gradient(to top, rgba(0,0,0,0.5) 0%, transparent 60%);
      pointer-events: none;
    }

    @keyframes gridScroll {
      from { background-position: 0 0; }
      to   { background-position: 0 60px; }
    }

    /* ─── Card ───────────────────────────────────── */
    .scene {
      position: relative;
      z-index: 10;
      perspective: 1200px;
    }

    .card {
      background: var(--glass);
      backdrop-filter: blur(30px) saturate(180%);
      -webkit-backdrop-filter: blur(30px) saturate(180%);
      padding: 52px 44px 44px;
      border-radius: 28px;
      border: 1px solid var(--border);
      box-shadow:
        0 0 0 1px rgba(0,255,136,0.05),
        0 32px 64px rgba(0,0,0,0.75),
        inset 0 1px 0 rgba(255,255,255,0.07);
      text-align: center;
      width: 420px;
      animation: cardIn 0.9s cubic-bezier(0.22,1,0.36,1) both;
      transition: transform 0.4s ease, box-shadow 0.4s ease;
    }

    .card:hover {
      transform: translateY(-5px) rotateX(1deg);
      box-shadow:
        0 0 0 1px rgba(0,255,136,0.1),
        0 44px 80px rgba(0,0,0,0.8),
        inset 0 1px 0 rgba(255,255,255,0.1);
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(50px) scale(0.96); }
      to   { opacity: 1; transform: translateY(0)    scale(1);    }
    }

    /* Corner accents — green tint for success state */
    .card::before, .card::after {
      content: '';
      position: absolute;
      width: 20px; height: 20px;
      border-color: var(--neon-green);
      border-style: solid;
      opacity: 0.35;
    }
    .card::before { top: 14px;    left: 14px;  border-width: 1.5px 0 0 1.5px; border-radius: 4px 0 0 0; }
    .card::after  { bottom: 14px; right: 14px; border-width: 0 1.5px 1.5px 0; border-radius: 0 0 4px 0; }

    /* ─── Lion Icon Ring ─────────────────────────── */
    .icon-ring {
      position: relative;
      width: 84px; height: 84px;
      margin: 0 auto 24px;
    }

    .icon-ring svg {
      position: absolute;
      inset: 0;
      width: 100%; height: 100%;
      animation: ringRotate 8s linear infinite;
    }

    @keyframes ringRotate {
      to { transform: rotate(360deg); }
    }

    .icon-inner {
      position: absolute;
      inset: 10px;
      border-radius: 50%;
      background: rgba(0,255,136,0.08);
      border: 1px solid rgba(0,255,136,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      filter: drop-shadow(0 0 10px rgba(0,255,136,0.5));
      animation: iconPulse 3s ease-in-out infinite;
    }

    @keyframes iconPulse {
      0%, 100% { box-shadow: 0 0 18px rgba(0,255,136,0.2); }
      50%       { box-shadow: 0 0 36px rgba(0,255,136,0.45); }
    }

    /* ─── Headings ───────────────────────────────── */
    .verified-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--neon-green);
      background: rgba(0,255,136,0.08);
      border: 1px solid rgba(0,255,136,0.2);
      padding: 5px 14px;
      border-radius: 999px;
      margin-bottom: 14px;
      animation: badgeGlow 2s ease-in-out infinite;
    }

    .badge-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--neon-green);
      box-shadow: 0 0 8px var(--neon-green);
      animation: dotBlink 1.2s ease-in-out infinite;
    }

    @keyframes badgeGlow {
      0%, 100% { box-shadow: 0 0 10px rgba(0,255,136,0.15); }
      50%       { box-shadow: 0 0 22px rgba(0,255,136,0.35); }
    }

    @keyframes dotBlink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.3; }
    }

    h1 {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 2px;
      background: linear-gradient(110deg, #fff 30%, rgba(255,255,255,0.6) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
    }

    .subtitle {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      letter-spacing: 1.5px;
      color: rgba(138,148,173,0.7);
      text-transform: uppercase;
      margin-bottom: 32px;
    }

    /* ─── Identity Block ─────────────────────────── */
    .identity-block {
      position: relative;
      background: rgba(0,0,0,0.35);
      border: 1px solid rgba(0,255,136,0.18);
      border-radius: 18px;
      padding: 20px 22px;
      margin-bottom: 24px;
      text-align: left;
      overflow: hidden;
    }

    /* Animated scan line */
    .identity-block::after {
      content: '';
      position: absolute;
      left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--neon-green), transparent);
      animation: scan 3s ease-in-out infinite;
      top: 0;
    }

    @keyframes scan {
      0%   { top: 0%;   opacity: 0; }
      10%  { opacity: 1; }
      90%  { opacity: 1; }
      100% { top: 100%; opacity: 0; }
    }

    .id-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2.5px;
      color: var(--neon-green);
      opacity: 0.7;
      display: block;
      margin-bottom: 10px;
    }

    .id-value {
      font-family: 'JetBrains Mono', monospace;
      font-size: 17px;
      font-weight: 700;
      color: #fff;
      letter-spacing: 1px;
      word-break: break-all;
    }

    .id-value .prefix {
      color: rgba(255,255,255,0.4);
      font-weight: 300;
    }

    /* ─── Status Row ─────────────────────────────── */
    .status-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 14px;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid rgba(0,255,136,0.25);
      color: var(--neon-green);
      background: rgba(0,255,136,0.06);
    }

    .status-pill-dot {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--neon-green);
      animation: dotBlink 1.4s infinite;
    }

    .proof-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      letter-spacing: 1px;
      color: rgba(0,210,255,0.6);
      text-transform: uppercase;
    }

    /* ─── Sign Out Button ────────────────────────── */
    .btn-logout {
      position: relative;
      width: 100%;
      padding: 16px 0;
      border: none;
      border-radius: 14px;
      background: transparent;
      cursor: pointer;
      overflow: hidden;
      margin-top: 6px;
      font-family: 'Syne', sans-serif;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--cyber-bg);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .btn-logout::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(110deg, var(--neon-blue), var(--neon-purple));
      z-index: 0;
      transition: opacity 0.25s ease;
    }

    .btn-logout::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(110deg, var(--neon-purple), var(--neon-blue));
      z-index: 0;
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    .btn-logout:hover::before { opacity: 0; }
    .btn-logout:hover::after  { opacity: 1; }

    .btn-logout:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 32px rgba(0,210,255,0.35);
    }

    .btn-logout:active { transform: translateY(0); }

    .btn-logout span {
      position: relative;
      z-index: 1;
    }

    /* ─── Divider ────────────────────────────────── */
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 22px 0 20px;
    }

    .divider-line {
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.08), transparent);
    }

    .divider-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      letter-spacing: 2px;
      color: rgba(255,255,255,0.2);
      text-transform: uppercase;
    }

    /* ─── Stagger Animations ─────────────────────── */
    .card > * {
      animation: fadeUp 0.6s cubic-bezier(0.22,1,0.36,1) both;
    }
    .card > *:nth-child(1) { animation-delay: 0.15s; }
    .card > *:nth-child(2) { animation-delay: 0.22s; }
    .card > *:nth-child(3) { animation-delay: 0.28s; }
    .card > *:nth-child(4) { animation-delay: 0.34s; }
    .card > *:nth-child(5) { animation-delay: 0.40s; }
    .card > *:nth-child(6) { animation-delay: 0.46s; }
    .card > *:nth-child(7) { animation-delay: 0.52s; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0);    }
    }
  </style>
</head>
<body>

  <!-- Galaxy Canvas -->
  <canvas id="starfield"></canvas>

  <!-- Grid Floor -->
  <div class="grid-bg"></div>

  <!-- ── Dashboard Card ────────────────────────────────── -->
  <div class="scene">
    <div class="card">

      <!-- Spinning Ring + Lion -->
      <div class="icon-ring">
        <svg viewBox="0 0 84 84" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="42" cy="42" r="40" stroke="url(#ringGrad)" stroke-width="1" stroke-dasharray="6 4" opacity="0.6"/>
          <defs>
            <linearGradient id="ringGrad" x1="0" y1="0" x2="84" y2="84" gradientUnits="userSpaceOnUse">
              <stop stop-color="#00ff88"/>
              <stop offset="1" stop-color="#00d2ff"/>
            </linearGradient>
          </defs>
        </svg>
        <div class="icon-inner">🦁</div>
      </div>

      <!-- Verified Badge -->
      <div class="verified-badge">
        <span class="badge-dot"></span>
        Identity Verified
      </div>

      <!-- Heading -->
      <h1>Welcome Back</h1>
      <p class="subtitle">Zero-Knowledge Proof · Plonky2</p>

      <!-- Identity Block -->
      <div class="identity-block">
        <span class="id-label">Anonymous Identity</span>
        <div class="id-value">
          <span class="prefix">User-</span><span id="user-id">Loading…</span>
        </div>
        <div class="status-row">
          <span class="status-pill"><span class="status-pill-dot"></span>Active</span>
          <span class="proof-tag">On-device · Rust/Plonky2</span>
        </div>
      </div>

      <!-- Divider -->
      <div class="divider">
        <span class="divider-line"></span>
        <span class="divider-label">Session</span>
        <span class="divider-line"></span>
      </div>

      <!-- Sign Out -->
      <button class="btn-logout" onclick="logout()">
        <span>Sign Out</span>
      </button>

    </div>
  </div>


  <!-- ── Galaxy Starfield ──────────────────────────────── -->
  <script>
  (function () {
    const canvas = document.getElementById('starfield');
    const ctx    = canvas.getContext('2d');
    let W, H, stars = [];
    const STAR_COUNT = 280;

    function resize () {
      W = canvas.width  = window.innerWidth;
      H = canvas.height = window.innerHeight;
    }

    function makeStar () {
      const hue = Math.random() < 0.15
        ? (Math.random() < 0.5 ? 155 : 195) // occasional green or blue tint
        : 0;
      return {
        x:    Math.random() * W,
        y:    Math.random() * H,
        r:    0.4 + Math.random() * 1.6,
        baseAlpha: 0.25 + Math.random() * 0.65,
        alpha: 0,
        twinklePeriod: 2000 + Math.random() * 4000,
        twinkleOffset: Math.random() * Math.PI * 2,
        driftX: (Math.random() - 0.5) * 0.012,
        driftY: -0.006 - Math.random() * 0.018,
        hue,
      };
    }

    function initStars () {
      stars = Array.from({ length: STAR_COUNT }, makeStar);
      stars.forEach(s => { s.alpha = s.baseAlpha; });
    }

    function draw (ts) {
      ctx.clearRect(0, 0, W, H);

      for (const s of stars) {
        const t = (ts / s.twinklePeriod) * Math.PI * 2 + s.twinkleOffset;
        s.alpha = s.baseAlpha * (0.45 + 0.55 * (Math.sin(t) * 0.5 + 0.5));

        s.x += s.driftX;
        s.y += s.driftY;

        if (s.y < -4)    { s.y = H + 2; s.x = Math.random() * W; }
        if (s.x < -4)    s.x = W + 2;
        if (s.x > W + 4) s.x = -2;

        if (s.r > 1.1) {
          const g = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.r * 3.5);
          const col = s.hue ? `hsla(${s.hue},85%,70%,` : 'rgba(255,255,255,';
          g.addColorStop(0,   col + (s.alpha * 0.9) + ')');
          g.addColorStop(0.4, col + (s.alpha * 0.25) + ')');
          g.addColorStop(1,   col + '0)');
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.r * 3.5, 0, Math.PI * 2);
          ctx.fillStyle = g;
          ctx.fill();
        }

        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fillStyle = s.hue
          ? `hsla(${s.hue},85%,88%,${s.alpha})`
          : `rgba(255,255,255,${s.alpha})`;
        ctx.fill();
      }

      requestAnimationFrame(draw);
    }

    window.addEventListener('resize', () => { resize(); initStars(); });
    resize();
    initStars();
    requestAnimationFrame(draw);
  })();
  </script>

  <!-- ── Session Logic ──────────────────────────────────── -->
  <script>
  (function () {
    const raw = localStorage.getItem('zkp_session');

    if (!raw) {
      window.location.href = 'index.html';
      return;
    }

    try {
      const session = JSON.parse(raw);
      const fullId  = session.nullifier || 'Unknown';
      // Show first 8 chars + ellipsis
      document.getElementById('user-id').textContent =
        fullId.substring(0, 8) + '•••';
    } catch (e) {
      console.error('Dashboard error:', e);
      document.getElementById('user-id').textContent = 'Error';
    }
  })();

  function logout () {
    localStorage.clear();
    window.location.href = 'index.html';
  }
  </script>

</body>
</html>
