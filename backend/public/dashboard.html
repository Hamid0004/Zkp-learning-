<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | ZKP Identity</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .dashboard-card {
            background: white;
            width: 90%;
            max-width: 440px;
            padding: 40px;
            border-radius: 28px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        .icon-container {
            width: 70px;
            height: 70px;
            background: #d1fae5;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            color: #059669;
            font-size: 35px;
            animation: bounceIn 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        @keyframes bounceIn {
            0% { transform: scale(0); }
            60% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        h1 { color: #111827; font-size: 24px; margin: 0 0 8px; font-weight: 700; }
        p { color: #6b7280; font-size: 14px; margin-bottom: 25px; line-height: 1.5; }

        /* ID Box */
        .id-box {
            background: #f9fafb;
            border: 2px dashed #e5e7eb;
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .label {
            display: block;
            font-size: 10px;
            text-transform: uppercase;
            color: #9ca3af;
            font-weight: 700;
            letter-spacing: 0.8px;
            margin-bottom: 5px;
        }

        .id-value {
            font-family: 'Courier New', monospace;
            font-size: 16px;
            color: #111827;
            font-weight: 700;
        }

        /* Benchmark Section */
        .benchmark-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: #f0f9ff;
            border: 1px solid #e0f2fe;
            padding: 12px;
            border-radius: 12px;
            text-align: left;
        }

        .stat-label { font-size: 9px; color: #0369a1; font-weight: 700; text-transform: uppercase; }
        .stat-value { font-size: 13px; color: #0c4a6e; font-weight: 700; margin-top: 2px; }

        .btn-logout {
            background: #111827;
            color: white;
            border: none;
            padding: 14px 0;
            border-radius: 12px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            width: 100%;
            transition: 0.2s;
        }

        .btn-logout:hover { background: #000; transform: translateY(-2px); }
    </style>
</head>
<body>

    <div class="dashboard-card">
        <div class="icon-container">🦁</div>
        <h1>Login Verified</h1>
        <p>Proof generated on-device via Rust/Plonky2.</p>

        <div class="id-box">
            <span class="label">Anonymous Identity</span>
            <div class="id-value" id="user-id">Verifying...</div>
        </div>

        <div class="benchmark-section">
            <div class="stat-card">
                <div class="stat-label">⏱️ Gen Time</div>
                <div class="stat-value" id="bench-time">0 ms</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">⚙️ Gates</div>
                <div class="stat-value" id="bench-gates">0</div>
            </div>
            <div class="stat-card" style="grid-column: span 2;">
                <div class="stat-label">📦 Proof Size</div>
                <div class="stat-value" id="bench-size">0 KB</div>
            </div>
        </div>

        <button class="btn-logout" onclick="logout()">Sign Out</button>
    </div>

    <script>
        // 🦁 Load Session Data
        const rawData = localStorage.getItem("zkp_session");

        if (!rawData) {
            window.location.href = "index.html";
        } else {
            try {
                const session = JSON.parse(rawData);
                
                // 1. Set ID (Shortened)
                const fullId = session.nullifier;
                document.getElementById("user-id").innerText = "User-" + fullId.substring(0, 8) + "•••";

                // 2. Set Benchmarks
                if (session.benchmarks) {
                    const b = session.benchmarks;
                    document.getElementById("bench-time").innerText = b.generation_time_ms + " ms";
                    document.getElementById("bench-gates").innerText = b.num_gates.toLocaleString();
                    
                    // Convert bytes to KB for readability
                    const kb = (b.proof_size_bytes / 1024).toFixed(2);
                    document.getElementById("bench-size").innerText = kb + " KB";
                }

            } catch (e) {
                console.error("Dashboard Error:", e);
                document.getElementById("user-id").innerText = "Error";
            }
        }

        function logout() {
            localStorage.clear();
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
