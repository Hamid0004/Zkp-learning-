<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZKP | Future of Identity</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=JetBrains+Mono:wght@300;500&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    :root {
      --neon-blue:   #00d2ff;
      --neon-purple: #9d50bb;
      --neon-green:  #00ff88;
      --cyber-bg:    #050b18;
      --glass:       rgba(255,255,255,0.04);
      --border:      rgba(255,255,255,0.08);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; min-height: 100%; }
    body {
      font-family: 'Syne', sans-serif;
      background: var(--cyber-bg);
      display: flex; justify-content: center; align-items: center;
      color: #fff; padding: 32px 16px; min-height: 100vh;
    }
    #starfield { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
    .grid-bg {
      position: fixed; inset: 0; z-index: 1;
      background-image:
        linear-gradient(rgba(0,210,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,210,255,0.025) 1px, transparent 1px);
      background-size: 60px 60px;
      transform: perspective(600px) rotateX(55deg) translateY(20%);
      transform-origin: center bottom;
      animation: gridScroll 25s linear infinite;
      mask-image: linear-gradient(to top, rgba(0,0,0,0.5) 0%, transparent 60%);
      pointer-events: none;
    }
    @keyframes gridScroll { from{background-position:0 0} to{background-position:0 60px} }

    .scene { position: relative; z-index: 10; width: 100%; max-width: 420px; }
    .card {
      background: var(--glass);
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      padding: 48px 40px 40px; border-radius: 28px;
      border: 1px solid var(--border);
      box-shadow: 0 0 0 1px rgba(0,210,255,0.06), 0 32px 64px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.08);
      text-align: center; width: 100%;
      animation: cardIn 0.9s cubic-bezier(0.22,1,0.36,1) both;
      transition: transform 0.4s ease, box-shadow 0.4s ease;
      position: relative;
    }
    .card:hover {
      transform: translateY(-4px) rotateX(1deg);
      box-shadow: 0 0 0 1px rgba(0,210,255,0.12), 0 40px 80px rgba(0,0,0,0.75), inset 0 1px 0 rgba(255,255,255,0.1);
    }
    @keyframes cardIn {
      from { opacity:0; transform:translateY(40px) scale(0.97); }
      to   { opacity:1; transform:translateY(0) scale(1); }
    }
    .card::before, .card::after {
      content:''; position:absolute; width:20px; height:20px;
      border-color:var(--neon-blue); border-style:solid; opacity:0.4;
    }
    .card::before { top:14px; left:14px; border-width:1.5px 0 0 1.5px; border-radius:4px 0 0 0; }
    .card::after  { bottom:14px; right:14px; border-width:0 1.5px 1.5px 0; border-radius:0 0 4px 0; }

    /* Logo */
    .zkp-logo {
      display:block; margin:0 auto 16px; width:62px; height:62px;
      filter: drop-shadow(0 0 12px var(--neon-blue)) drop-shadow(0 0 28px var(--neon-purple));
      animation: logoPulse 3s ease-in-out infinite;
    }
    @keyframes logoPulse {
      0%,100% { transform:scale(1); filter:drop-shadow(0 0 12px var(--neon-blue)) drop-shadow(0 0 28px var(--neon-purple)); }
      50%     { transform:scale(1.07); filter:drop-shadow(0 0 20px var(--neon-blue)) drop-shadow(0 0 45px var(--neon-purple)); }
    }
    h2 {
      font-size:22px; font-weight:800; letter-spacing:4px; text-transform:uppercase;
      background:linear-gradient(110deg,var(--neon-blue) 20%,var(--neon-purple) 80%);
      -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
      margin-bottom:6px;
    }
    .subtitle {
      font-family:'JetBrains Mono',monospace; color:rgba(138,148,173,0.8);
      font-size:12px; letter-spacing:1.5px; text-transform:uppercase;
    }

    /* ── DESKTOP: QR section ─────────────────────────────────── */
    .desktop-section { display:none; }

    #qr-container {
      display:inline-flex; justify-content:center; align-items:center;
      padding:18px; border-radius:20px; margin:28px 0 22px;
      background:#ffffff;
      border:2px solid rgba(0,210,255,0.5);
      box-shadow: 0 0 30px rgba(0,210,255,0.35), 0 0 60px rgba(157,80,187,0.2);
      animation:hologram 3s ease-in-out infinite;
      transition:transform 0.3s ease, box-shadow 0.3s ease;
      min-width:200px; min-height:200px;
    }
    #qr-container:hover {
      transform:scale(1.04) rotate(-0.5deg);
      box-shadow:0 0 50px rgba(0,210,255,0.5), 0 0 80px rgba(157,80,187,0.35);
    }
    @keyframes hologram {
      0%,100% { transform:translateY(0);    box-shadow:0 0 30px rgba(0,210,255,0.35),0 0 60px rgba(157,80,187,0.2); }
      50%     { transform:translateY(-6px); box-shadow:0 0 50px rgba(0,210,255,0.55),0 0 90px rgba(157,80,187,0.35); }
    }
    .status-box {
      display:inline-flex; align-items:center; gap:12px; padding:11px 22px;
      border-radius:999px; background:rgba(0,0,0,0.35); border:1px solid rgba(0,210,255,0.18);
      animation:statusGlow 2s ease-in-out infinite; margin-bottom:4px;
    }
    @keyframes statusGlow {
      0%,100% { box-shadow:0 0 12px rgba(0,210,255,0.2); }
      50%     { box-shadow:0 0 24px rgba(0,210,255,0.45); }
    }
    .loader-dot {
      width:10px; height:10px; border-radius:50%;
      background:linear-gradient(135deg,var(--neon-blue),var(--neon-purple));
      box-shadow:0 0 10px var(--neon-blue),0 0 20px var(--neon-purple);
      animation:dotPulse 1.4s ease-in-out infinite; flex-shrink:0;
    }
    @keyframes dotPulse {
      0%,100% { transform:scale(1); opacity:1; }
      50%     { transform:scale(1.7); opacity:0.4; }
    }
    .status-text {
      font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:500;
      color:var(--neon-blue); text-transform:uppercase; letter-spacing:1.5px;
    }

    /* ── MOBILE: Buttons section ─────────────────────────────── */
    .mobile-section { display:none; }

    .mobile-hint {
      font-family:'JetBrains Mono',monospace;
      font-size:11px; color:rgba(138,148,173,0.6);
      letter-spacing:1px; margin: 18px 0 20px;
      line-height:1.6;
    }

    /* ZKAuth main button */
    .zkauth-btn {
      width:100%; padding:15px 20px; border-radius:14px;
      border:1px solid rgba(0,210,255,0.4); background:rgba(0,210,255,0.07);
      color:var(--neon-blue); font-family:'Syne',sans-serif;
      font-size:14px; font-weight:700; letter-spacing:1px;
      cursor:pointer; display:flex; align-items:center; justify-content:center; gap:10px;
      transition:all 0.25s ease; margin-bottom:10px;
    }
    .zkauth-btn:hover {
      background:rgba(0,210,255,0.14); border-color:rgba(0,210,255,0.7);
      box-shadow:0 0 28px rgba(0,210,255,0.25); transform:translateY(-1px);
    }
    .zkauth-btn:active { transform:translateY(0); }
    .btn-badge {
      font-size:9px; letter-spacing:1.5px; background:rgba(0,210,255,0.12);
      border:1px solid rgba(0,210,255,0.28); padding:2px 8px; border-radius:999px;
      color:rgba(0,210,255,0.8); font-family:'JetBrains Mono',monospace; margin-left:auto;
    }

    /* Claim buttons */
    .claim-row { display:flex; gap:10px; margin-bottom:10px; }
    .claim-btn {
      flex:1; padding:13px 6px; border-radius:12px;
      border:1px solid rgba(157,80,187,0.25); background:rgba(157,80,187,0.05);
      color:rgba(255,255,255,0.7); font-family:'Syne',sans-serif;
      cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:5px;
      transition:all 0.25s ease;
    }
    .claim-btn:hover {
      background:rgba(157,80,187,0.13); border-color:rgba(157,80,187,0.55);
      box-shadow:0 0 18px rgba(157,80,187,0.2); transform:translateY(-1px); color:#fff;
    }
    .claim-btn:active { transform:translateY(0); }
    .claim-icon { font-size:20px; }
    .claim-label { font-size:10px; font-weight:700; letter-spacing:0.5px; }
    .claim-tag {
      font-family:'JetBrains Mono',monospace; font-size:8px;
      letter-spacing:1px; color:rgba(157,80,187,0.75); text-transform:uppercase;
    }

    /* Divider */
    .divider {
      display:flex; align-items:center; gap:12px; margin:18px 0;
      color:rgba(138,148,173,0.4); font-family:'JetBrains Mono',monospace;
      font-size:10px; letter-spacing:2px; text-transform:uppercase;
    }
    .divider::before, .divider::after { content:''; flex:1; height:1px; background:rgba(255,255,255,0.07); }

    /* Standard login button */
    .std-btn {
      width:100%; padding:13px; border-radius:12px;
      border:1px solid rgba(255,255,255,0.1); background:rgba(255,255,255,0.04);
      color:rgba(255,255,255,0.55); font-family:'Syne',sans-serif;
      font-size:13px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase;
      cursor:pointer; transition:all 0.25s ease;
    }
    .std-btn:hover {
      background:rgba(255,255,255,0.08); border-color:rgba(255,255,255,0.2);
      color:rgba(255,255,255,0.85); transform:translateY(-1px);
    }
    .std-btn:active { transform:translateY(0); }

    /* Success card */
    .success-icon-wrap {
      display:flex; justify-content:center; align-items:center;
      margin:0 auto 18px; width:72px; height:72px; border-radius:50%;
      background:rgba(0,255,136,0.08); border:2px solid rgba(0,255,136,0.4);
      box-shadow:0 0 24px rgba(0,255,136,0.3),0 0 60px rgba(0,255,136,0.15);
      animation:successPop 0.6s cubic-bezier(0.175,0.885,0.32,1.275) both;
    }
    .success-icon-wrap svg {
      width:36px; height:36px; stroke:var(--neon-green); stroke-width:2.5;
      fill:none; stroke-linecap:round; stroke-linejoin:round;
      filter:drop-shadow(0 0 8px rgba(0,255,136,0.6));
    }
    @keyframes successPop { from{transform:scale(0.5);opacity:0} to{transform:scale(1);opacity:1} }
    .success-title { background:linear-gradient(110deg,var(--neon-green) 20%,#61ffc1 80%) !important; }
    .nullifier-container {
      background:rgba(0,0,0,0.4); padding:16px 18px; border-radius:14px;
      border:1px solid rgba(0,210,255,0.25); margin-top:24px;
      text-align:left; box-shadow:0 0 20px rgba(0,210,255,0.1);
    }
    .nullifier-label {
      font-family:'JetBrains Mono',monospace; color:var(--neon-blue);
      font-size:9px; font-weight:500; text-transform:uppercase;
      letter-spacing:2px; display:block; margin-bottom:10px; opacity:0.8;
    }
    .nullifier-val {
      font-family:'JetBrains Mono',monospace; font-size:11px;
      color:rgba(255,255,255,0.85); word-break:break-all; line-height:1.7;
    }

    /* Toast */
    .toast {
      position:fixed; bottom:28px; left:50%; transform:translateX(-50%);
      background:rgba(5,11,24,0.96); border:1px solid rgba(0,210,255,0.3);
      color:var(--neon-blue); font-family:'JetBrains Mono',monospace;
      font-size:11px; letter-spacing:1px; padding:12px 24px; border-radius:999px;
      box-shadow:0 0 24px rgba(0,210,255,0.2); z-index:999; white-space:nowrap;
      animation:toastIn 0.3s ease;
    }
    @keyframes toastIn {
      from { opacity:0; transform:translateX(-50%) translateY(10px); }
      to   { opacity:1; transform:translateX(-50%) translateY(0); }
    }
    .hidden { display:none !important; }
  </style>
</head>
<body>
  <canvas id="starfield"></canvas>
  <div class="grid-bg"></div>
  <div class="toast hidden" id="toast"></div>

  <div class="scene">

    <!-- ── Login Card ───────────────────────────────────────────── -->
    <div class="card" id="login-card">

      <!-- ZKP Shield Logo -->
      <svg class="zkp-logo" viewBox="0 0 62 62" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M31 5L9 14.5v15.8c0 12.8 9.5 24.8 22 27.7 12.5-2.9 22-14.9 22-27.7V14.5L31 5z"
          fill="rgba(0,210,255,0.07)" stroke="url(#sg)" stroke-width="1.8" stroke-linejoin="round"/>
        <text x="31" y="37" font-family="'Syne',sans-serif" font-weight="800"
          font-size="14" fill="url(#tg)" text-anchor="middle">ZK</text>
        <defs>
          <linearGradient id="sg" x1="9" y1="5" x2="53" y2="58" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#00d2ff"/><stop offset="100%" stop-color="#9d50bb"/>
          </linearGradient>
          <linearGradient id="tg" x1="18" y1="25" x2="44" y2="38" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#00d2ff"/><stop offset="100%" stop-color="#9d50bb"/>
          </linearGradient>
        </defs>
      </svg>

      <h2>ZK-PROTOCOL</h2>
      <p class="subtitle">Zero-Knowledge Identity Gateway</p>

      <!-- ══ DESKTOP: QR ═══════════════════════════════════════ -->
      <div class="desktop-section" id="desktop-section">
        <div id="qr-container"></div>
        <div class="status-box">
          <div class="loader-dot"></div>
          <span class="status-text" id="status-label">Awaiting Encrypted Link…</span>
        </div>
        <p style="font-family:'JetBrains Mono',monospace;font-size:10px;color:rgba(138,148,173,0.45);margin-top:14px;letter-spacing:1px;">
          SCAN WITH ZKP APP ON YOUR PHONE
        </p>
      </div>

      <!-- ══ MOBILE: Buttons ════════════════════════════════════ -->
      <div class="mobile-section" id="mobile-section">
        <p class="mobile-hint">Tap to authenticate with<br/>your ZKP identity wallet</p>

        <!-- ZKAuth full login -->
        <button class="zkauth-btn" onclick="zkAuthTap('zkauth')">
          <svg width="18" height="18" viewBox="0 0 62 62" fill="none">
            <path d="M31 5L9 14.5v15.8c0 12.8 9.5 24.8 22 27.7 12.5-2.9 22-14.9 22-27.7V14.5L31 5z"
              fill="none" stroke="currentColor" stroke-width="3.5" stroke-linejoin="round"/>
            <text x="31" y="37" font-size="13" fill="currentColor"
              text-anchor="middle" font-weight="800" font-family="sans-serif">ZK</text>
          </svg>
          Login with ZKAuth
          <span class="btn-badge">Passkey</span>
        </button>

        <!-- Claim buttons -->
        <div class="claim-row">
          <button class="claim-btn" onclick="zkAuthTap('age')">
            <span class="claim-icon">👤</span>
            <span class="claim-label">Verify 18+</span>
            <span class="claim-tag">Age</span>
          </button>
          <button class="claim-btn" onclick="zkAuthTap('dob')">
            <span class="claim-icon">📅</span>
            <span class="claim-label">DOB Range</span>
            <span class="claim-tag">Privacy</span>
          </button>
          <button class="claim-btn" onclick="zkAuthTap('identity')">
            <span class="claim-icon">🛂</span>
            <span class="claim-label">Full ID</span>
            <span class="claim-tag">Passport</span>
          </button>
        </div>

        <div class="divider"><span>or</span></div>
        <button class="std-btn" onclick="showToast('Standard Login — Coming Soon')">
          Standard Login
        </button>
      </div>

    </div>

    <!-- ── Success Card ──────────────────────────────────────────── -->
    <div class="card hidden" id="success-card">
      <div class="success-icon-wrap">
        <svg viewBox="0 0 36 36"><polyline points="6,18 14,26 30,10"/></svg>
      </div>
      <h2 class="success-title">VERIFIED</h2>
      <p class="subtitle">Proof integrated successfully.</p>
      <div class="nullifier-container">
        <span class="nullifier-label">Nullifier Hash</span>
        <div class="nullifier-val" id="nullifier-val">…</div>
      </div>
    </div>

  </div>

  <!-- ── Galaxy Stars ─────────────────────────────────────────── -->
  <script>
  (function () {
    const canvas = document.getElementById('starfield');
    const ctx = canvas.getContext('2d');
    let W, H, stars = [];
    function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
    function makeStar() {
      const hue = Math.random() < 0.15 ? (Math.random() < 0.5 ? 195 : 280) : 0;
      return {
        x:Math.random()*W, y:Math.random()*H, r:0.4+Math.random()*1.6,
        baseAlpha:0.25+Math.random()*0.65, alpha:0,
        twinklePeriod:2000+Math.random()*4000,
        twinkleOffset:Math.random()*Math.PI*2,
        driftX:(Math.random()-0.5)*0.012,
        driftY:-0.006-Math.random()*0.018, hue,
      };
    }
    function initStars() { stars=Array.from({length:280},makeStar); stars.forEach(s=>{s.alpha=s.baseAlpha;}); }
    function draw(ts) {
      ctx.clearRect(0,0,W,H);
      for(const s of stars){
        const t=(ts/s.twinklePeriod)*Math.PI*2+s.twinkleOffset;
        s.alpha=s.baseAlpha*(0.45+0.55*(Math.sin(t)*0.5+0.5));
        s.x+=s.driftX; s.y+=s.driftY;
        if(s.y<-4){s.y=H+2;s.x=Math.random()*W;}
        if(s.x<-4) s.x=W+2; if(s.x>W+4) s.x=-2;
        if(s.r>1.1){
          const g=ctx.createRadialGradient(s.x,s.y,0,s.x,s.y,s.r*3.5);
          const c=s.hue?`hsla(${s.hue},90%,75%,`:'rgba(255,255,255,';
          g.addColorStop(0,c+(s.alpha*0.9)+')'); g.addColorStop(0.4,c+(s.alpha*0.25)+')'); g.addColorStop(1,c+'0)');
          ctx.beginPath(); ctx.arc(s.x,s.y,s.r*3.5,0,Math.PI*2); ctx.fillStyle=g; ctx.fill();
        }
        ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
        ctx.fillStyle=s.hue?`hsla(${s.hue},90%,90%,${s.alpha})`:`rgba(255,255,255,${s.alpha})`;
        ctx.fill();
      }
      requestAnimationFrame(draw);
    }
    window.addEventListener('resize',()=>{resize();initStars();});
    resize(); initStars(); requestAnimationFrame(draw);
  })();
  </script>

  <!-- ── Core Logic ────────────────────────────────────────────── -->
  <script>
  const API_URL = window.location.origin + '/api';
  let sessionId = null, pollInterval = null, toastTimer = null;

  // ── Device detection ─────────────────────────────────────────
  const isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent)
    || (navigator.maxTouchPoints > 1 && window.innerWidth < 768);

  // Show correct section
  document.getElementById(isMobile ? 'mobile-section' : 'desktop-section').style.display = 'block';

  // ── Desktop: start QR session ────────────────────────────────
  if (!isMobile) {
    startSession('zkauth');
  }

  async function startSession(claimType = 'zkauth') {
    try {
      const res  = await fetch(`${API_URL}/start-session?claim=${claimType}`);
      const data = await res.json();
      sessionId  = data.session_id;

      const qrDiv = document.getElementById('qr-container');
      if (qrDiv) {
        qrDiv.innerHTML = '';
        new QRCode(qrDiv, {
          text: data.deep_link || sessionId,   // deep link in QR — app handles it
          width: 200, height: 200,
          colorDark: '#000000', colorLight: '#ffffff',
          correctLevel: QRCode.CorrectLevel.H,
        });
      }

      pollInterval = setInterval(checkStatus, 2000);
    } catch (err) {
      console.error('Session start failed:', err);
      const lbl = document.getElementById('status-label');
      if (lbl) { lbl.textContent = 'OFFLINE'; lbl.style.color = '#ff4b4b'; }
    }
  }

  async function checkStatus() {
    if (!sessionId) return;
    try {
      const res  = await fetch(`${API_URL}/poll-status/${sessionId}`);
      if (!res.ok) return;
      const data = await res.json();

      // Update status label based on state machine
      const lbl = document.getElementById('status-label');
      if (lbl) {
        const labels = {
          pending:   'Awaiting Encrypted Link…',
          scanning:  'Scan Detected — Awaiting Biometric…',
          proving:   'Generating ZK Proof…',
          completed: 'Verified!',
        };
        lbl.textContent = labels[data.status] || data.status;
      }

      if (data.status === 'completed') {
        clearInterval(pollInterval);
        localStorage.setItem('zkp_session', JSON.stringify({
          nullifier   : data.nullifier    || 'Unknown',
          proof       : data.proof        || '',
          metadata    : data.metadata     || {},
          claim_result: data.claim_result || {},
        }));
        showSuccess(data.nullifier);
      }
    } catch (err) { console.error('Poll error:', err); }
  }

  // ── Mobile: ZKAuth tap → deep link ──────────────────────────
  async function zkAuthTap(claimType) {
    try {
      const res  = await fetch(`${API_URL}/start-session?claim=${claimType}`);
      const data = await res.json();
      sessionId  = data.session_id;

      // Notify scan immediately (optimistic)
      fetch(`${API_URL}/scan-notify`, {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ sessionId }),
      });

      // Open app via deep link
      window.location.href = data.deep_link;

      // Start polling — when user comes back, we check
      pollInterval = setInterval(checkStatus, 2000);

      showToast('Opening ZKP App…');
    } catch (err) {
      showToast('Connection error — try again');
    }
  }

  function showSuccess(nullifier) {
    document.getElementById('login-card').classList.add('hidden');
    document.getElementById('success-card').classList.remove('hidden');
    document.getElementById('nullifier-val').textContent = nullifier || '—';
    setTimeout(() => { window.location.href = 'dashboard.html'; }, 2000);
  }

  function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.remove('hidden');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.add('hidden'), 3000);
  }
  </script>

</body>
</html>
